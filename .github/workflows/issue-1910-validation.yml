name: Issue 1910 validation
on:
  push:
    branches: [validation/1910-asset-units-20261125]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        revision: [fix, baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ matrix.revision == 'baseline' && 'a7a38eb546b9e6c4d6a7bbd65eb65cf6032079a9' || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Check focused formatting
        if: matrix.revision == 'fix'
        run: rustfmt --check --edition 2021 contracts/tests/escrow_asset_units.rs
      - name: Focused asset-unit tests
        if: matrix.revision == 'fix'
        working-directory: contracts
        run: cargo test --locked --test escrow_asset_units
      - name: Full contract tests
        continue-on-error: true
        working-directory: contracts
        run: cargo test --locked --all
      - name: Clippy
        continue-on-error: true
        working-directory: contracts
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Wasm build
        continue-on-error: true
        working-directory: contracts
        run: cargo build --locked --release --target wasm32v1-none
  repository:
    strategy:
      fail-fast: false
      matrix:
        revision: [fix, baseline]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ matrix.revision == 'baseline' && 'a7a38eb546b9e6c4d6a7bbd65eb65cf6032079a9' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix backend
      - name: Repository script tests
        continue-on-error: true
        run: node --test scripts/*.test.mjs
      - name: Configuration validation
        continue-on-error: true
        run: npm run validate:configs
      - name: Formatting validation
        continue-on-error: true
        run: npm run format:check
